## 开启后，source/_posts/<文章名>/ 里的图片附件会被拷到该文章的链接目录下，
## 文章里用相对路径引用即可，例如 ![](xxx.jpg)
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''
index_generator:
  path: ''
  per_page: 10
  order_by: '-date'
default_category: uncategorized
category_map: null
tag_map: null
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
include: null
exclude: null
ignore: null

# Markdown
## postAsset: true 让文章里 ![](xxx.jpg) 这样的相对图片路径能自动解析到该文章的附件目录
## （配合上面的 post_asset_folder: true 使用）
marked:
  postAsset: true

mathjax:
  tags: ams # 或 'ams' (支持公式编号)
  single_dollars: true # 启用 $...$ 作为行内公式
  every_page: true # 设为 true 则所有页面都渲染
  ## 中文教材里常见的简写命令（\ch \sh \isin \exist \sub）MathJax 默认没有定义，
  ## 不处理会渲染成红色的 "Undefined control sequence"。这里统一映射到标准 LaTeX 命令，
  ## 之后文章里再写到这些简写也不会报错。
  extension_options:
    macros:
      ch: '\cosh'
      sh: '\sinh'
      isin: '\in'
      exist: '\exists'
      sub: '\subset'

# Search
## Meow 主题的本地搜索依赖 hexo-generator-searchdb，主题会在页面里读取下面的 path
## Docs: https://github.com/next-theme/hexo-generator-searchdb
search:
  path: search.json
  field: post
  content: true
  format: striptags

theme: meow
deploy:
  type: git
  repo: git@github.com:BTXL11/BTXL11.github.io.git
  branch: main
