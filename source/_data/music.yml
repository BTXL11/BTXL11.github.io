# Meow 主题的全局音乐播放器歌单（对应主题配置 themes/meow/_config.yml 里的 music 段）
#
# 每首歌支持这些字段（字段名跟 APlayer 一致，主题直接原样交给播放器）：
#   name   歌名
#   artist 歌手
#   url    音频地址
#   cover  封面图地址
#   lrc    歌词文件地址（主题配置 music.lyric: true 时会显示歌词）
#
# 音频地址必须是 https 或者本站相对路径：
#   - 本地文件放到 source/music/ 下，这里写 /music/文件名.flac
#   - 外链音频用 https，用 http 的话在 GitHub Pages 上会被浏览器按混合内容拦截
#   - 文件名里的空格要写成 %20，中文可以直接写
#
# 注：source/music/kugou/ 里的 .kgg / .kgma 是酷狗会员加密格式（文件头是 DRM 标识，
#     不是音频数据），浏览器解不出来，所以没有写进这个歌单。
#
# 留空数组（[]）表示不显示播放器。

- name: '晴天和猫'
  artist: '花粥'
  url: '/music/花粥%20-%20晴天和猫.flac'
  cover: '/music/cover/晴天和猫.jpg'
