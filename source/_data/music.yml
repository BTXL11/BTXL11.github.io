# Meow 主题的全局音乐播放器歌单（对应主题配置 themes/meow/_config.yml 里的 music 段）
#
# 每首歌支持这些字段（字段名跟 APlayer 一致，主题直接原样交给播放器）：
#   name   歌名
#   artist 歌手
#   url    音频地址
#   cover  封面图地址
#   lrc    歌词文件地址（主题配置 music.lyric: true 时会显示歌词）
#
# 音频地址必须是 https 或者本站相对路径：
#   - 本地文件放到 source/music/ 下，这里写 /music/文件名.mp3
#   - 外链音频用 https，用 http 的话在 GitHub Pages 上会被浏览器按混合内容拦截
#
# 用法：把下面的示例取消注释并改成自己的歌即可。留空数组表示不显示播放器。
#
# - name: 歌名
#   artist: 歌手
#   url: /music/xxx.mp3
#   cover: /images/xxx.jpg
#   lrc: /music/lyric/xxx.lrc
[]
